<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>UrbanGo — Pasajero</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:#0a0a0a; color:#f5f4f0; height:100vh; overflow:hidden; display:flex; flex-direction:column; }

  #header {
    position:relative; z-index:500;
    background:#0a0a0a; border-bottom:1px solid #1e1e1e;
    padding:12px 16px;
    display:flex; align-items:center; justify-content:space-between;
    flex-shrink:0;
  }
  .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:20px; letter-spacing:-1px; }
  .logo span { color:#e8ff47; }
  .user-info { font-size:12px; color:#888; }
  .btn-logout { background:none; border:1px solid #2e2e2e; color:#888; border-radius:8px; padding:4px 10px; font-size:12px; cursor:pointer; }

  #mapContainer { flex:1; position:relative; min-height:0; }
  #map { width:100%; height:100%; }

  #panel {
    position:absolute; bottom:0; left:0; right:0; z-index:400;
    background:#0a0a0a; border-radius:24px 24px 0 0;
    border-top:1px solid #1e1e1e;
    padding:0 16px 32px;
  }
  .handle { width:40px; height:4px; background:#2e2e2e; border-radius:2px; margin:12px auto 16px; }

  .step { display:none; flex-direction:column; gap:12px; }
  .step.active { display:flex; }
  .step-title { font-family:'Syne',sans-serif; font-size:20px; font-weight:700; }
  .step-title span { color:#e8ff47; }

  .input-row {
    display:flex; align-items:center; gap:10px;
    background:#1a1a1a; border-radius:14px; padding:12px 16px;
  }
  .input-row input {
    flex:1; background:none; border:none; outline:none;
    color:#f5f4f0; font-family:'DM Sans',sans-serif; font-size:15px;
  }
  .input-row input::placeholder { color:#555; }

  .btn-main {
    width:100%; padding:16px; border-radius:14px;
    background:#e8ff47; color:#0a0a0a;
    font-family:'Syne',sans-serif; font-weight:700; font-size:15px;
    border:none; cursor:pointer; transition:opacity .2s;
  }
  .btn-main:disabled { opacity:.3; pointer-events:none; }
  .btn-main.danger { background:#f87171; color:#fff; }
  .btn-main.ghost { background:#1a1a1a; color:#f5f4f0; }

  .driver-card {
    background:#1a1a1a; border-radius:14px; padding:14px;
    display:flex; gap:12px; align-items:center;
  }
  .driver-avatar {
    width:46px; height:46px; border-radius:50%;
    background:#2e2e2e; display:flex; align-items:center;
    justify-content:center; font-size:20px;
    border:2px solid #e8ff47; flex-shrink:0;
  }
  .driver-name { font-family:'Syne',sans-serif; font-weight:700; font-size:15px; }
  .driver-sub { font-size:12px; color:#888; margin-top:2px; }
  .driver-plate {
    background:#0a0a0a; border-radius:8px; padding:4px 10px;
    font-family:'Syne',sans-serif; font-size:12px; font-weight:700;
    border:1px solid #2e2e2e; letter-spacing:1px;
  }
  .status-badge {
    background:#1a2a00; border:1px solid #e8ff47;
    border-radius:10px; padding:10px 14px;
    font-size:13px; color:#e8ff47; text-align:center;
  }
  .fare-info { display:flex; gap:10px; }
  .fare-card {
    flex:1; background:#1a1a1a; border-radius:12px; padding:12px;
    text-align:center;
  }
  .fare-val { font-family:'Syne',sans-serif; font-weight:800; font-size:22px; color:#e8ff47; }
  .fare-label { font-size:11px; color:#888; margin-top:2px; }
</style>
</head>
<body>

<div id="header">
  <div class="logo">Urban<span>Go</span></div>
  <div>
    <span class="user-info" id="userName"></span>
    <button class="btn-logout" onclick="localStorage.clear();window.location.href='/passenger/login.html';">Salir</button>
  </div>
</div>

<div id="mapContainer">
  <div id="map"></div>
</div>

<div id="panel">
  <div class="handle"></div>

  <div class="step active" id="step0">
    <div class="step-title">¿A dónde <span>vamos?</span></div>
    <div class="input-row">
      <span>📍</span>
      <input type="text" id="originInput" placeholder="Obteniendo ubicación..." readonly>
    </div>
    <div class="input-row">
      <span>🎯</span>
      <input type="text" id="destInput" placeholder="¿A dónde vas?">
    </div>
    <button class="btn-main" id="btnRequest" onclick="requestTrip()" disabled>Buscar viaje →</button>
  </div>

  <div class="step" id="step1">
    <div class="step-title">Buscando <span>conductor...</span></div>
    <div class="status-badge">🔍 Conectando con conductores cercanos</div>
    <button class="btn-main ghost" onclick="cancelTrip()">Cancelar</button>
  </div>

  <div class="step" id="step2">
    <div class="step-title">Conductor en <span>camino</span></div>
    <div class="driver-card">
      <div class="driver-avatar">👨‍✈️</div>
      <div style="flex:1">
        <div class="driver-name" id="driverName">Conductor</div>
        <div class="driver-name" style="font-size:11px;color:#e8ff47" id="tripStatus">Aceptado</div>
        <div class="driver-sub">Vehículo asignado</div>
      </div>
      <div class="driver-plate">---</div>
    </div>
    <div class="fare-info">
      <div class="fare-card">
        <div class="fare-val" id="fareAmount">Bs. 0</div>
        <div class="fare-label">Tarifa estimada</div>
      </div>
      <div class="fare-card">
        <div class="fare-val" id="distanceKm">0 km</div>
        <div class="fare-label">Distancia</div>
      </div>
    </div>
    <button class="btn-main danger" onclick="cancelTrip()">Cancelar viaje</button>
  </div>

  <div class="step" id="step3">
    <div class="step-title">¡Viaje <span>completado!</span> 🎉</div>
    <div class="fare-info">
      <div class="fare-card">
        <div class="fare-val" id="finalFare">Bs. 0</div>
        <div class="fare-label">Total a pagar</div>
      </div>
    </div>
    <button class="btn-main" onclick="newTrip()">Pedir otro viaje →</button>
  </div>
</div>

<!-- Google Maps JavaScript API -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDyfS3_Q-7a0sIcqde7ebDOcg0va3jwh4g&callback=initMap" async defer></script>

<script>
const API_URL = 'https://urbango.duckdns.org';

// Auth check
const token = localStorage.getItem('token');
const userStr = localStorage.getItem('user');
if (!token || !userStr) {
    window.location.href = '/passenger/login.html';
}
const user = JSON.parse(userStr || '{}');
document.getElementById('userName').textContent = user.full_name || '';

let map, userMarker, driverMarker;
let userLat = 10.4806;
let userLng = -66.9036;
let currentTripId = null;
let ws = null;

// Callback de Google Maps
window.initMap = function() {
    map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: userLat, lng: userLng },
        zoom: 15,
        disableDefaultUI: true,
        styles: [
            { elementType: 'geometry', stylers: [{ color: '#1a1a2e' }] },
            { elementType: 'labels.text.fill', stylers: [{ color: '#8888aa' }] },
            { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#2e2e4e' }] },
            { featureType: 'road', elementType: 'geometry.stroke', stylers: [{ color: '#1a1a3e' }] },
            { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#0d1b2a' }] },
        ]
    });

    // Intentar GPS real
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            pos => {
                userLat = pos.coords.latitude;
                userLng = pos.coords.longitude;
                map.setCenter({ lat: userLat, lng: userLng });
                if (userMarker) userMarker.setPosition({ lat: userLat, lng: userLng });
                document.getElementById('originInput').value = `${userLat.toFixed(4)}, ${userLng.toFixed(4)}`;
            },
            () => {
                document.getElementById('originInput').value = 'Ubicación por defecto';
            },
            { timeout: 10000, enableHighAccuracy: true }
        );
    }

    userMarker = new google.maps.Marker({
        position: { lat: userLat, lng: userLng },
        map: map,
        title: 'Mi ubicación',
        icon: {
            path: google.maps.SymbolPath.CIRCLE,
            scale: 10,
            fillColor: '#e8ff47',
            fillOpacity: 1,
            strokeColor: '#ffffff',
            strokeWeight: 2,
        }
    });

    document.getElementById('originInput').value = `${userLat.toFixed(4)}, ${userLng.toFixed(4)}`;
    document.getElementById('btnRequest').disabled = false;

    connectWS();
};

function connectWS() {
    ws = new WebSocket(`wss://urbango.duckdns.org/ws/passenger/${user.id}`);
    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'trip_status_update') updateTripStatus(data.status);
        if (data.type === 'driver_location') updateDriverOnMap(data.lat, data.lng);
    };
    ws.onclose = () => setTimeout(connectWS, 3000);
}

function updateTripStatus(status) {
    const statusMap = {
        'accepted': '✅ Conductor aceptó',
        'driver_en_route': '🚗 Conductor en camino',
        'arrived': '📍 Conductor llegó',
        'onboard': '🎉 ¡A bordo!',
        'in_progress': '🚀 Viaje en curso',
        'completed': '🏁 Completado'
    };
    const el = document.getElementById('tripStatus');
    if (el) el.textContent = statusMap[status] || status;
    if (['accepted','driver_en_route','arrived','onboard','in_progress'].includes(status)) showStep(2);
    if (status === 'completed') {
        document.getElementById('finalFare').textContent = document.getElementById('fareAmount').textContent;
        showStep(3);
    }
}

function updateDriverOnMap(lat, lng) {
    if (!map) return;
    if (driverMarker) {
        driverMarker.setPosition({ lat, lng });
    } else {
        driverMarker = new google.maps.Marker({
            position: { lat, lng },
            map: map,
            title: 'Conductor',
            icon: {
                path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
                scale: 6,
                fillColor: '#e8ff47',
                fillOpacity: 1,
                strokeColor: '#ffffff',
                strokeWeight: 1,
            }
        });
    }
}

async function requestTrip() {
    const dest = document.getElementById('destInput').value.trim();
    if (!dest) return;
    try {
        const response = await fetch(API_URL + '/trips/request', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({
                origin_lat: userLat,
                origin_lng: userLng,
                origin_address: document.getElementById('originInput').value,
                dest_lat: userLat + 0.01,
                dest_lng: userLng + 0.01,
                dest_address: dest,
                payment_method: 'cash'
            })
        });
        const data = await response.json();
        if (data.id) {
            currentTripId = data.id;
            document.getElementById('fareAmount').textContent = `Bs. ${data.fare}`;
            document.getElementById('distanceKm').textContent = `${data.distance_km} km`;
            showStep(1);
        }
    } catch(e) {
        console.error('Error solicitando viaje:', e);
    }
}

async function cancelTrip() {
    if (currentTripId) {
        await fetch(`${API_URL}/trips/${currentTripId}/status`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ status: 'cancelled' })
        });
    }
    newTrip();
}

function newTrip() {
    currentTripId = null;
    document.getElementById('destInput').value = '';
    document.getElementById('btnRequest').disabled = true;
    showStep(0);
}

function showStep(n) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById('step' + n).classList.add('active');
}

document.getElementById('destInput').addEventListener('input', function() {
    document.getElementById('btnRequest').disabled = this.value.length < 3;
});
</script>
</body>
</html>
